<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}}</title>
<!-- Privacy-friendly analytics by Plausible -->
<script async src="https://plausible.io/js/pa-UgXLJ3iDFx7E8L29683bk.js"></script>
<script>
  window.plausible=window.plausible||function(){(plausible.q=plausible.q||[]).push(arguments)},plausible.init=plausible.init||function(i){plausible.o=i||{}};
  plausible.init()
</script>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0;
    background: #131313;
    color: #eee;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }
  header {
    width: 100%;
    max-width: 1200px;
    padding: 16px 24px;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .owner {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }
  .owner img {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: block;
    flex: none;
  }
  .owner span {
    color: #ccc;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  header a.back {
    color: #4a9eff;
    text-decoration: none;
    font-weight: 600;
    white-space: nowrap;
  }
  main {
    display: flex;
    flex: 1;
    align-items: center;
    justify-content: center;
    width: 100%;
    padding: 0 16px 24px;
    box-sizing: border-box;
  }
  .stage {
    position: relative;
    max-width: 100%;
  }
  .stage img, .stage video {
    max-width: 100%;
    max-height: 76vh;
    display: block;
    border-radius: 4px;
  }
  .stage video {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    border-radius: 4px;
  }
  .details {
    width: 100%;
    max-width: 700px;
    padding: 0 24px 40px;
    box-sizing: border-box;
    text-align: center;
  }
  h1 {
    font-size: 1.1rem;
    font-weight: 400;
    color: #eee;
    margin: 0 0 10px;
  }
  .meta {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }
  .badge {
    display: inline-block;
    background: #0063dc;
    color: #fff;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    padding: 3px 10px;
    border-radius: 999px;
  }
  time {
    color: #999;
    font-size: 0.85rem;
  }
  .tags {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
  }
  .tag {
    background: #262626;
    color: #bbb;
    font-size: 0.8rem;
    padding: 4px 10px;
    border-radius: 999px;
  }
  footer {
    padding: 0 24px 24px;
    text-align: center;
  }
  footer a {
    color: #666;
    font-size: 0.8rem;
    text-decoration: none;
  }
  footer a:hover {
    color: #999;
    text-decoration: underline;
  }
</style>
</head>
<body>
  <header>
    {{if .OwnerName}}
    <div class="owner">
      <img src="{{.OwnerAvatarURL}}" alt="">
      <span>{{.OwnerName}}</span>
    </div>
    {{else}}<span></span>{{end}}
    <a class="back" href="{{.PhotoPageURL}}">View on Flickr &rarr;</a>
  </header>
  <main>
    <div class="stage">
      <img src="{{.ImageURL}}" alt="{{.Title}}">
      <video src="{{.VideoURL}}" autoplay muted loop playsinline></video>
    </div>
  </main>
  <div class="details">
    <h1>{{.Title}}</h1>
    <div class="meta">
      <span class="badge">Motion Photo</span>
      {{if .DateTaken}}<time>{{.DateTaken}}</time>{{end}}
    </div>
    {{if .Tags}}
    <div class="tags">
      {{range .Tags}}<span class="tag">{{.}}</span>{{end}}
    </div>
    {{end}}
  </div>
  <footer>
    <a href="https://www.flickr.com/groups/14903850@N24/discuss/">Questions or bugs?</a>
  </footer>
</body>
</html>
