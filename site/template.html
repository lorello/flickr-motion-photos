<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}}</title>
<!-- Privacy-friendly analytics by Plausible -->
<script async src="https://plausible.io/js/pa-UgXLJ3iDFx7E8L29683bk.js"></script>
<script>
  window.plausible=window.plausible||function(){(plausible.q=plausible.q||[]).push(arguments)},plausible.init=plausible.init||function(i){plausible.o=i||{}};
  plausible.init()
</script>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0;
    background: #131313;
    color: #eee;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }
  header {
    width: 100%;
    padding: 16px 24px;
    box-sizing: border-box;
    text-align: left;
  }
  header a {
    color: #0063dc;
    text-decoration: none;
    font-weight: 600;
  }
  main {
    display: flex;
    flex: 1;
    align-items: center;
    justify-content: center;
    width: 100%;
    padding: 0 16px 32px;
    box-sizing: border-box;
  }
  .stage {
    position: relative;
    max-width: 100%;
  }
  .stage img, .stage video {
    max-width: 100%;
    max-height: 82vh;
    display: block;
    border-radius: 4px;
  }
  .stage video {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    border-radius: 4px;
  }
  h1 {
    font-size: 1rem;
    font-weight: 400;
    color: #bbb;
    margin: 16px 0 0;
    text-align: center;
  }
</style>
</head>
<body>
  <header><a href="{{.PhotoPageURL}}">&larr; View on Flickr</a></header>
  <main>
    <div class="stage">
      <img src="{{.ImageURL}}" alt="{{.Title}}">
      <video src="{{.VideoURL}}" autoplay muted loop playsinline></video>
    </div>
  </main>
  <h1>{{.Title}}</h1>
</body>
</html>
